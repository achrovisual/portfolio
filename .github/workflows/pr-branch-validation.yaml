name: PR Validation

on:
  pull_request:
    branches: [main, develop]

jobs:
  validate-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch naming convention
        run: |
          head_ref="${GITHUB_HEAD_REF}"
          base_ref="${GITHUB_BASE_REF}"
          echo "PR Head Branch: $head_ref"
          echo "PR Target Branch: $base_ref"

          # Allow release PRs (develop -> main or release/* -> main) without prefix constraints
          if [[ "$base_ref" == "main" && ( "$head_ref" == "develop" || "$head_ref" =~ ^release/.+ ) ]]; then
            echo "Release PR targeting main detected. Skipping prefix check."
            exit 0
          fi

          regex="^(feature|fix|chore|release)/.+$"

          if [[ "$head_ref" =~ $regex ]]; then
            echo "Branch name passes the naming requirement."
          else
            echo "::error::Branch name must be prefixed with 'feature/', 'fix/', 'chore/', or 'release/'."
            exit 1
          fi
        shell: bash

  check-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md was updated
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q "^CHANGELOG.md$"; then
            echo "CHANGELOG.md was updated — check passed."
          else
            if [ "${{ github.base_ref }}" = "main" ]; then
              echo "::error::CHANGELOG.md was not updated in this PR. Add an entry under [Unreleased] before merging to main."
              exit 1
            else
              echo "::warning::CHANGELOG.md wasn't touched in this PR. Consider adding a line under [Unreleased] if this change is user-facing."
            fi
          fi
