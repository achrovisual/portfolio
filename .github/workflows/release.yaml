name: Release & Publish Docker Image

on:
  push:
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-docker-image:
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalise IMAGE_NAME
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=beta,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=stable,enable=${{ github.ref_name == 'main' }}
            type=raw,value=latest,enable=${{ github.ref == github.event.repository.default_branch }}

      - name: Debug - Show extracted metadata tags
        run: |
          echo "Metadata Action Output Tags: ${{ steps.meta.outputs.tags }}"
          if [ -z "${{ steps.meta.outputs.tags }}" ]; then
            echo "Warning: No tags were generated by the docker/metadata-action. Check conditions."
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: "linux/amd64,linux/arm64"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            GH_API_TOKEN=${{ secrets.GH_API_TOKEN }}
          build-args: |
            GH_USERNAME=${{ secrets.GH_USERNAME }}

  update-helm-chart:
    needs: publish-docker-image
    if: github.ref_name == 'main' || github.ref_name == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Debug - Show received tags from previous job
        run: |
          echo "Received tags from publish-docker-image: '${{ needs.publish-docker-image.outputs.tags }}'"
          if [ -z "${{ needs.publish-docker-image.outputs.tags }}" ]; then
            echo "Error: Tags received from previous job are empty! This is the root cause."
          fi

      - name: Checkout Helm Charts repository
        uses: actions/checkout@v4
        with:
          repository: achrovisual/hl-k3s
          token: ${{ secrets.HELM_REPO_PAT }}
          path: helm-charts

      - name: Install yq
        run: |
          YQ_VERSION="v4.44.1"
          curl -L "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Extract Image Tag
        id: get_image_tag
        run: |
          IMAGE_TAG=$(echo "${{ needs.publish-docker-image.outputs.tags }}" | grep -oP 'sha-[a-f0-9]+' | head -n 1)

          if [ -z "$IMAGE_TAG" ]; then
            echo "Warning: SHA tag not found, attempting general extraction."
            IMAGE_TAG=$(echo "${{ needs.publish-docker-image.outputs.tags }}" | head -n 1 | awk -F':' '{print $NF}')
          fi

          echo "Extracted Image Tag: $IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Update Helm chart image tag
        working-directory: ./helm-charts
        run: |
          HELM_CHART_PATH="charts/private/portfolio"
          IMAGE_TAG="${{ env.IMAGE_TAG }}"

          echo "Updating $HELM_CHART_PATH/values.yaml with image tag: $IMAGE_TAG"
          yq e ".image.tag = \"$IMAGE_TAG\"" -i "$HELM_CHART_PATH/values.yaml"

          echo "--- Updated values.yaml content ---"
          cat "$HELM_CHART_PATH/values.yaml"
          echo "-----------------------------------"

      - name: Commit and push changes
        working-directory: ./helm-charts
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add charts/private/portfolio/values.yaml
          git diff --staged --exit-code || (git commit -m "Update portfolio image to ${{ env.IMAGE_TAG }}" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.HELM_REPO_PAT }}
